name: Release Obsidian Plugin

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0.0, 20.06.2026

permissions:
  contents: write
  # Needed for GitHub Artifact Attestations (build provenance)
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      # Establish build provenance for the release artifacts.
      # See https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds
      - name: Attest build provenance (main.js)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Attest build provenance (styles.css)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css

      # Package the required release files into a zip and attach them to the tag release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
